[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saip"
version = "0.1.0"
description = "Proactive agent research: detect flow vs stuck from desktop telemetry and decide when to interrupt."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8"]
tray = ["pystray>=0.19", "pillow>=9"]

[project.scripts]
saip = "saip.cli:main"

# src layout: `pip install -e .` puts synth, classifier, llm and saip on the path and installs the `saip` command.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
classifier = ["weights.json"]
saip = ["ui/*.html"]
