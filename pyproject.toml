[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saip"
version = "0.2.0"
description = "Proactive agent research: detect flow vs stuck from desktop telemetry and decide when to interrupt."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "tomli>=2; python_version < '3.11'",
    "pystray>=0.19",          # the tray icon
    "pillow>=9",              # draws the tray icon
    "pynput>=1.7",            # the typed-text monitor (on only when the setup wizard or private.toml says so)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
typing = []                       # kept so `pip install -e ".[typing]"` still works; pynput is a core dependency now
tray = []                         # likewise for pystray and Pillow

[project.scripts]
saip = "saip.cli:main"

# src layout: `pip install -e .` puts synth, classifier, llm and saip on the path and installs the `saip` command.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
classifier = ["weights.json"]
saip = ["ui/dist/*", "ui/dist/assets/*"]
